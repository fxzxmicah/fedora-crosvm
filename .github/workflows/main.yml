name: Build RPM

on:
  - push

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools
      run: dnf install -y dnf5-plugins rpmdevtools createrepo_c

    - name: Get Files
      run: |
        for spec in SPECS/*.spec; do
          spectool --define "_topdir ${GITHUB_WORKSPACE}" -R --get-files --all $spec
        done

    - name: Create Local Repo
      run : |
        mkdir -p ${GITHUB_WORKSPACE}/RPMS
        createrepo ${GITHUB_WORKSPACE}/RPMS
        echo "[local-rpm]" | tee /etc/yum.repos.d/local-rpm.repo
        echo "name=Local RPM Repository" | tee -a /etc/yum.repos.d/local-rpm.repo
        echo "baseurl=file://${GITHUB_WORKSPACE}/RPMS" | tee -a /etc/yum.repos.d/local-rpm.repo
        echo "enabled=1" | tee -a /etc/yum.repos.d/local-rpm.repo
        echo "gpgcheck=0" | tee -a /etc/yum.repos.d/local-rpm.repo

    - name: Build Dep RPM
      run: |
        PACKAGES=($(<SPECS/ORDER))
        for package in "${PACKAGES[@]}"; do
          dnf --refresh builddep -y SPECS/$package.spec
          rpmbuild --define "_topdir ${GITHUB_WORKSPACE}" -br SPECS/$package.spec || dnf --refresh builddep -y SRPMS/*.buildreqs.nosrc.rpm && rm SRPMS/*.buildreqs.nosrc.rpm
          rpmbuild --define "_topdir ${GITHUB_WORKSPACE}" -bb SPECS/$package.spec
          createrepo --update ${GITHUB_WORKSPACE}/RPMS
        done

    - name: Build RPM
      run: |
        dnf --refresh builddep -y SPECS/crosvm.spec
        rpmbuild --define "_topdir ${GITHUB_WORKSPACE}" -br SPECS/$package.spec || dnf --refresh builddep -y SRPMS/*.buildreqs.nosrc.rpm && rm SRPMS/*.buildreqs.nosrc.rpm
        rpmbuild --define "_topdir ${GITHUB_WORKSPACE}" -bb SPECS/crosvm.spec

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rpm-package
        path: RPMS/
